{% extends "base.html" %}
{% block title %}仪表盘 - DBA 自动运维平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-speedometer2 text-primary"></i> 运维仪表盘</h4>
    <div>
        <button class="btn btn-primary btn-sm" onclick="refreshDashboard()">
            <i class="bi bi-arrow-clockwise"></i> 刷新
        </button>
        <button class="btn btn-outline-success btn-sm" onclick="runFullInspection()">
            <i class="bi bi-play-fill"></i> 立即巡检
        </button>
    </div>
</div>

<!-- 概览卡片 -->
<div class="row g-3 mb-3" id="overview-cards">
    <!-- 由 JS 动态填充 -->
</div>

<!-- 实例状态表格 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-server"></i> 实例状态一览</span>
        <span class="badge bg-secondary" id="last-update-time">--</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-striped mb-0" id="instance-table">
                <thead class="table-light">
                    <tr>
                        <th>状态</th>
                        <th>实例名称</th>
                        <th>描述</th>
                        <th>连接</th>
                        <th>磁盘</th>
                        <th>内存</th>
                        <th>作业</th>
                        <th>备份</th>
                        <th>阻塞</th>
                        <th>最近巡检</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="instance-tbody">
                    <tr><td colspan="11" class="text-center text-muted">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 告警面板 -->
<div class="card mt-3">
    <div class="card-header">
        <i class="bi bi-exclamation-triangle text-warning"></i> 最近告警
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>时间</th>
                        <th>实例</th>
                        <th>严重度</th>
                        <th>类别</th>
                        <th>消息</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="alert-tbody">
                    <tr><td colspan="6" class="text-center text-muted">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 全局数据缓存
let dashboardData = null;

// 页面加载时获取数据
document.addEventListener('DOMContentLoaded', () => {
    refreshDashboard();
});

function refreshDashboard() {
    fetch('/api/dashboard')
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                dashboardData = res.data;
                renderOverview(res.data.overview);
                renderInstanceTable(res.data.instances);
                renderAlerts(res.data.alert_summary.items);
                updateNavStatus(res.data.overview);
                document.getElementById('last-update-time').textContent =
                    '更新: ' + res.data.generated_at;
            }
        })
        .catch(err => console.error('加载仪表盘失败:', err));
}

function renderOverview(overview) {
    const cards = [
        { label: '实例总数', value: overview.total_instances, color: 'primary', icon: 'server' },
        { label: '已连接', value: overview.connected, color: 'success', icon: 'check-circle' },
        { label: '未连接', value: overview.disconnected, color: 'danger', icon: 'x-circle' },
        { label: '正常', value: overview.green, color: 'success', icon: 'check-circle-fill' },
        { label: '警告', value: overview.yellow, color: 'warning', icon: 'exclamation-triangle-fill' },
        { label: '异常', value: overview.red, color: 'danger', icon: 'x-circle-fill' },
    ];

    const container = document.getElementById('overview-cards');
    container.innerHTML = cards.map(c => `
        <div class="col-md-2 col-sm-4">
            <div class="card border-${c.color} border-start border-3">
                <div class="card-body text-center py-2">
                    <div class="text-muted small">${c.label}</div>
                    <div class="fs-3 fw-bold text-${c.color}">${c.value}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function renderInstanceTable(instances) {
    const tbody = document.getElementById('instance-tbody');
    if (!instances.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">暂无实例数据</td></tr>';
        return;
    }

    tbody.innerHTML = instances.map(inst => {
        const lightIcon = {
            green: '<i class="bi bi-circle-fill text-success fs-5"></i>',
            yellow: '<i class="bi bi-circle-fill text-warning fs-5"></i>',
            red: '<i class="bi bi-circle-fill text-danger fs-5"></i>',
        }[inst.light] || '';

        const connIcon = inst.is_connected
            ? '<i class="bi bi-check-circle text-success"></i>'
            : '<i class="bi bi-x-circle text-danger"></i>';

        // 查找各分类的最新结果
        function catStatus(cat) {
            const r = inst.latest_results.find(x => x.category === cat);
            if (!r) return '<span class="text-muted">-</span>';
            const icons = {
                ok: '<i class="bi bi-check-circle text-success"></i>',
                warning: '<i class="bi bi-exclamation-triangle text-warning"></i>',
                error: '<i class="bi bi-x-circle text-danger"></i>',
            };
            return icons[r.status] || '<span class="text-muted">-</span>';
        }

        return `
            <tr>
                <td>${lightIcon}</td>
                <td><a href="/instance/${inst.name}" class="fw-bold text-decoration-none">${inst.name}</a></td>
                <td class="text-muted small">${inst.description || ''}</td>
                <td>${connIcon}</td>
                <td>${catStatus('disk')}</td>
                <td>${catStatus('memory')}</td>
                <td>${catStatus('jobs')}</td>
                <td>${catStatus('backups')}</td>
                <td>${catStatus('blocking')}</td>
                <td class="small">${inst.last_inspection || '从未'}</td>
                <td>
                    <a href="/instance/${inst.name}" class="btn btn-sm btn-outline-primary">详情</a>
                </td>
            </tr>
        `;
    }).join('');
}

function renderAlerts(alerts) {
    const tbody = document.getElementById('alert-tbody');
    if (!alerts.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-success">🎉 无活跃告警</td></tr>';
        return;
    }

    tbody.innerHTML = alerts.map(a => {
        const sevBadge = a.severity === 'critical'
            ? '<span class="badge bg-danger">严重</span>'
            : '<span class="badge bg-warning text-dark">警告</span>';
        return `
            <tr>
                <td class="small">${a.created_at}</td>
                <td>${a.instance_name}</td>
                <td>${sevBadge}</td>
                <td>${a.category}</td>
                <td>${a.message}</td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary" onclick="resolveAlert(${a.id})">已处理</button>
                </td>
            </tr>
        `;
    }).join('');
}

function updateNavStatus(overview) {
    document.getElementById('nav-instance-count').textContent = overview.total_instances;
}

function resolveAlert(id) {
    fetch(`/api/alerts/${id}/resolve`, { method: 'POST' })
        .then(() => refreshDashboard());
}

function runFullInspection() {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '巡检中...';
    fetch('/api/inspection/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})   // 空对象 = 巡检所有实例
    })
        .then(res => res.json())
        .then(() => {
            btn.disabled = false;
            btn.textContent = '立即巡检';
            refreshDashboard();
        })
        .catch(() => {
            btn.disabled = false;
            btn.textContent = '立即巡检';
        });
}
</script>
{% endblock %}
